<!DOCTYPE html>
<html>
<head>
<title>DOM Manipulation</title>
</head>

<body>

<h2 id="title">
    Inventory System
</h2>

<button onclick="changeText()">
    Change Text
</button>

<script>

function changeText()
{
    document
    .getElementById("title")
    .innerHTML =
    "DOM Manipulation Successful";
}

</script>

</body>
</html>
